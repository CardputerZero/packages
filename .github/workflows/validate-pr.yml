# Copy to CardputerZero/packages: .github/workflows/validate-pr.yml
#
name: Validate Package PR

# Stage 1 of 2 (untrusted): runs in the fork/PR context with a READ-ONLY token
# and NO secrets. It downloads the .deb declared by each *.deb.release.json
# manifest, verifies it, and writes the outcome to an artifact. A separate
# privileged workflow (validate-pr-comment.yml, workflow_run) posts the comment.
# This avoids the pull_request_target + checkout-PR-head footgun.

on:
  pull_request:
    branches: [main]
    paths:
      - 'pool/**/*.deb.release.json'
      - 'pool/**/*.deb'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code (untrusted, data only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev jq

      - name: Validate manifests and packages
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          ERRORS=""
          mkdir -p /tmp/out

          # Third-party submissions always arrive as fork PRs. Same-repo PRs are
          # maintainer/infra changes (e.g. the migration that seeds many authors'
          # packages at once) and must not be judged by the per-submission
          # ownership rules below.
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "Same-repo (maintainer) PR — skipping third-party submission validation."
            { echo "## ✅ Validation skipped"; echo; echo "Same-repo (maintainer/infra) PR — third-party submission checks are not applied."; } > /tmp/out/result.md
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A submission may only touch its own pool entry. Anything else — a
          # workflow, a script, another package — would be merged by the
          # auto-merge below without a human reading it, so it is refused here.
          OUTSIDE=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | grep -v '^pool/main/' || true)
          if [ -n "$OUTSIDE" ]; then
            ERRORS="${ERRORS}- ❌ Submissions may only change files under \`pool/main/\`; found:\n$(echo "$OUTSIDE" | sed 's/^/    /')\n"
          fi

          # The checkout above is the PR's own code, so the policy is taken from
          # the base branch: a fork must not be able to grade itself with a
          # rewritten rule.
          if ! git show "$BASE_SHA:.github/scripts/install_path_policy.py" > /tmp/install_path_policy.py 2>/dev/null; then
            ERRORS="${ERRORS}- ❌ internal: install_path_policy.py is missing on the base branch\n"
          fi

          # Reject raw .deb committed to git (must use the release-manifest flow).
          if git diff --name-only --diff-filter=A "$BASE_SHA".."$HEAD_SHA" | grep -q '\.deb$'; then
            ERRORS="${ERRORS}- ❌ Raw \`.deb\` files must not be committed to git. Upload the binary to a Release in your fork and submit a \`*.deb.release.json\` manifest (use \`czdev publish\`).\n"
          fi

          ADDED_MANIFESTS=$(git diff --name-only --diff-filter=A "$BASE_SHA".."$HEAD_SHA" | grep '\.deb\.release\.json$' || true)

          # Ownership is first-come-first-served by GitHub login. On a fork PR the
          # PR author login is trusted, so it is the authoritative uploader key.
          author_lc=$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')

          for manifest in $ADDED_MANIFESTS; do
            echo "=== $manifest ==="
            if [[ "$manifest" != pool/main/* ]]; then
              ERRORS="${ERRORS}- ❌ \`$manifest\` is outside \`pool/main/\`\n"; continue
            fi
            url=$(jq -r '.url // empty' "$manifest")
            sha=$(jq -r '.sha256 // empty' "$manifest")
            fname=$(jq -r '.filename // empty' "$manifest")
            dir_pkg=$(echo "$manifest" | cut -d/ -f3)
            if [[ -z "$url" || -z "$sha" || -z "$fname" ]]; then
              ERRORS="${ERRORS}- ❌ \`$manifest\` must contain \`url\`, \`sha256\`, \`filename\`\n"; continue
            fi

            deb="/tmp/$fname"
            if ! curl -fL --retry 3 --max-time 600 -o "$deb" "$url"; then
              ERRORS="${ERRORS}- ❌ Could not download \`$fname\` from \`$url\`\n"; continue
            fi
            got=$(sha256sum "$deb" | awk '{print $1}')
            if [[ "$got" != "$sha" ]]; then
              ERRORS="${ERRORS}- ❌ \`$fname\` sha256 mismatch (manifest \`$sha\`, downloaded \`$got\`)\n"; continue
            fi

            ctrl_pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null || echo "")
            new_ver=$(dpkg-deb -f "$deb" Version 2>/dev/null || echo "")
            if [[ -z "$ctrl_pkg" ]]; then
              ERRORS="${ERRORS}- ❌ \`$fname\` is not a valid .deb\n"; continue
            fi
            if [[ "$dir_pkg" != "$ctrl_pkg" ]]; then
              ERRORS="${ERRORS}- ❌ Directory '$dir_pkg' != Package field '$ctrl_pkg'\n"
            fi
            case "$(dpkg-deb -f "$deb" Architecture 2>/dev/null)" in
              arm64|all) ;;
              *) ERRORS="${ERRORS}- ❌ \`$fname\` architecture must be arm64/all, got '$(dpkg-deb -f "$deb" Architecture 2>/dev/null)'\n" ;;
            esac
            # Write to a file first: `dpkg-deb -c | grep -q` makes grep close the
            # pipe on first match, so dpkg-deb dies with SIGPIPE and pipefail
            # turns the whole check into a false "missing .desktop".
            dpkg-deb -c "$deb" > /tmp/deb-contents.txt 2>/dev/null || true
            # The launcher only reads this exact location, so a .desktop parked
            # anywhere else would install an app that never appears.
            if ! grep -q 'usr/share/APPLaunch/applications/.*\.desktop$' /tmp/deb-contents.txt; then
              ERRORS="${ERRORS}- ❌ \`$fname\` is missing usr/share/APPLaunch/applications/*.desktop\n"
            fi
            # setuid/setgid bits in the archive listing (perm string like -rwsr-xr-x)
            if awk '{print $1}' /tmp/deb-contents.txt | grep -qE '^[-l].{2}[sS]|^[-l].{5}[sS]'; then
              ERRORS="${ERRORS}- ❌ \`$fname\` contains setuid/setgid files\n"
            fi
            if awk '{print $1}' /tmp/deb-contents.txt | grep -qE '^[bc]'; then
              ERRORS="${ERRORS}- ❌ \`$fname\` contains device files\n"
            fi
            # Install locations, by the same script and wording the portal channel
            # uses, so a package is judged identically whichever way it arrives.
            rm -f /tmp/bad-paths.txt /tmp/path-help.md
            python3 /tmp/install_path_policy.py \
              "$ctrl_pkg" "$deb" /tmp/bad-paths.txt /tmp/path-help.md
            if [ -s /tmp/bad-paths.txt ]; then
              ERRORS="${ERRORS}- ❌ \`$fname\` installs files in disallowed locations:\n$(sed 's/^/    /' /tmp/bad-paths.txt)\n"
              # The rule and the fix-it prompt are the same for every package, so
              # keep the first one and state it once after the error list.
              [ -s /tmp/path-help-final.md ] || cp /tmp/path-help.md /tmp/path-help-final.md
            fi
            # maintainer scripts: dangerous patterns
            rm -rf /tmp/ctrl && dpkg-deb -e "$deb" /tmp/ctrl 2>/dev/null || true
            for scr in preinst postinst prerm postrm; do
              [ -f "/tmp/ctrl/$scr" ] || continue
              if grep -qE 'rm[[:space:]]+(-[a-zA-Z]+[[:space:]]+)*(/([[:space:]]|$)|/(bin|etc|usr|var|home|boot|lib))|(curl|wget)[^|]*\|[[:space:]]*(ba)?sh|mkfs|/etc/(passwd|shadow|sudoers)|dd[[:space:]][^|]*of=/dev/' "/tmp/ctrl/$scr"; then
                ERRORS="${ERRORS}- ❌ \`$fname\` has a dangerous pattern in maintainer script $scr\n"
              fi
            done
            # apps must NOT run as root: reject bundled systemd *system* services
            # that run as root (no User=, User=root/0, and no DynamicUser=yes).
            ROOT_SVC=$(python3 - "$deb" <<'PY'
          import io, subprocess, sys, tarfile
          DIRS = ("lib/systemd/system/", "usr/lib/systemd/system/", "etc/systemd/system/")
          def runs_as_root(text):
              in_service = False; user = None; dyn = False
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line[0] in "#;": continue
                  if line.startswith("[") and line.endswith("]"):
                      in_service = line.lower() == "[service]"; continue
                  if not in_service or "=" not in line: continue
                  k, _, v = line.partition("="); k = k.strip().lower(); v = v.strip()
                  if k == "user": user = v
                  elif k == "dynamicuser": dyn = v.lower() in ("1", "yes", "true", "on")
              if dyn: return False
              if not user: return True
              return user in ("root", "0")
          try:
              tb = subprocess.run(["dpkg-deb", "--fsys-tarfile", sys.argv[1]], capture_output=True, check=True).stdout
          except Exception:
              sys.exit(0)
          out = []
          with tarfile.open(fileobj=io.BytesIO(tb)) as tf:
              for m in tf.getmembers():
                  if not m.isfile(): continue
                  n = m.name.lstrip("./")
                  if not (n.endswith(".service") and n.startswith(DIRS)): continue
                  f = tf.extractfile(m)
                  if f and runs_as_root(f.read().decode("utf-8", "replace")): out.append(n)
          print("\n".join(out))
          PY
          )
            if [ -n "$ROOT_SVC" ]; then
              ERRORS="${ERRORS}- ❌ \`$fname\` must not run as root; these systemd services run as root (add User=<non-root> to [Service]):\n$(echo "$ROOT_SVC" | sed 's/^/    /')\n"
            fi
            if ! echo "$ctrl_pkg" | grep -qP '^[a-z0-9][a-z0-9.+\-]+$'; then
              ERRORS="${ERRORS}- ❌ Invalid package name: '$ctrl_pkg'\n"
            fi
            expected_name="${ctrl_pkg}_${new_ver}_$(dpkg-deb -f "$deb" Architecture).deb"
            # GitHub release assets sanitize '~' to '.'; allow either form.
            if [[ "$fname" != "$expected_name" && "$fname" != "${expected_name//\~/.}" ]]; then
              ERRORS="${ERRORS}- ❌ filename '$fname' should be '$expected_name'\n"
            fi

            # --- ownership: the submitted manifest must record `uploaded_by` ==
            #     the PR author, and (if the package already exists) the recorded
            #     owner must be the PR author. No maintainer-email matching. ---
            manifest_owner=$(jq -r '.uploaded_by // empty' "$manifest" | tr '[:upper:]' '[:lower:]')
            if [[ -z "$manifest_owner" ]]; then
              ERRORS="${ERRORS}- ❌ \`$manifest\` is missing \`uploaded_by\` (should be your GitHub login '${PR_AUTHOR}'; re-run \`czdev publish\`)\n"
            elif [[ "$manifest_owner" != "$author_lc" ]]; then
              ERRORS="${ERRORS}- ❌ \`$manifest\` records uploaded_by '@${manifest_owner}' but the PR author is '@${PR_AUTHOR}'\n"
            fi

            # Existing owner + latest version from the manifests on base.
            existing_ver=""; latest_manifest=""
            for ex in $(git ls-tree -r "$BASE_SHA" --name-only | grep "^pool/main/${dir_pkg}/.*\.deb\.release\.json$" || true); do
              v=$(git show "$BASE_SHA:$ex" | jq -r '.version // empty' 2>/dev/null || true)
              if [[ -n "$v" ]] && { [[ -z "$existing_ver" ]] || dpkg --compare-versions "$v" gt "$existing_ver" 2>/dev/null; }; then
                existing_ver="$v"; latest_manifest="$ex"
              fi
            done
            if [[ -n "$latest_manifest" ]]; then
              owner_login=$(git show "$BASE_SHA:$latest_manifest" | jq -r '.uploaded_by // empty' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
              # Legacy manifests have no uploaded_by: derive from the published
              # binary's Maintainer noreply address.
              if [[ -z "$owner_login" ]]; then
                ourl=$(git show "$BASE_SHA:$latest_manifest" | jq -r '.url // empty' 2>/dev/null || true)
                if [[ -n "$ourl" ]] && curl -fsL --max-time 300 -o /tmp/owner.deb "$ourl" 2>/dev/null; then
                  om=$(dpkg-deb -f /tmp/owner.deb Maintainer 2>/dev/null | grep -oP '<\K[^>]+' | tr '[:upper:]' '[:lower:]' || true)
                  owner_login=$(printf '%s' "$om" | sed -nE 's/^([0-9]+\+)?([^@]+)@users\.noreply\.github\.com$/\2/p')
                fi
              fi
              if [[ -n "$owner_login" && "$owner_login" != "$author_lc" ]]; then
                ERRORS="${ERRORS}- ❌ package '$dir_pkg' is owned by @${owner_login}; only the original uploader can update it\n"
              fi
            fi
            if [[ -n "$existing_ver" ]] && dpkg --compare-versions "$new_ver" le "$existing_ver" 2>/dev/null; then
              ERRORS="${ERRORS}- ❌ Version $new_ver is not newer than existing $existing_ver\n"
            fi

            if [[ -z "$ERRORS" ]]; then echo "✓ $fname passed"; fi
          done

          # Ownership check for deleted manifests: only the recorded uploader
          # (or, for legacy manifests, the Maintainer-noreply login) may remove.
          DELETED=$(git diff --name-only --diff-filter=D "$BASE_SHA".."$HEAD_SHA" | grep '\.deb\.release\.json$' || true)
          for manifest in $DELETED; do
            owner_login=$(git show "$BASE_SHA:$manifest" | jq -r '.uploaded_by // empty' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
            if [[ -z "$owner_login" ]]; then
              url=$(git show "$BASE_SHA:$manifest" | jq -r '.url // empty' 2>/dev/null || true)
              [[ -z "$url" ]] && continue
              deb="/tmp/del-$(basename "$manifest").deb"
              if curl -fsL --max-time 600 -o "$deb" "$url" 2>/dev/null; then
                om=$(dpkg-deb -f "$deb" Maintainer 2>/dev/null | grep -oP '<\K[^>]+' | tr '[:upper:]' '[:lower:]' || true)
                owner_login=$(printf '%s' "$om" | sed -nE 's/^([0-9]+\+)?([^@]+)@users\.noreply\.github\.com$/\2/p')
              fi
            fi
            if [[ -n "$owner_login" && "$owner_login" != "$author_lc" ]]; then
              ERRORS="${ERRORS}- ❌ Cannot delete \`$manifest\`: package is owned by @${owner_login}, not @${PR_AUTHOR}\n"
            fi
          done

          if [[ -n "$ERRORS" ]]; then
            { echo "## ❌ Package Validation Failed"; echo; echo -e "$ERRORS"
              [ -s /tmp/path-help-final.md ] && { echo; cat /tmp/path-help-final.md; }
              echo; echo "---"; echo "*If you believe this is an error, contact a maintainer.*"; } > /tmp/out/result.md
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            { echo "## ✅ Package Validation Passed"; echo; echo "All checks passed. Ready for maintainer review."; } > /tmp/out/result.md
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/out/result.md

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation
          path: /tmp/out

      - name: Fail job if validation failed
        if: steps.validate.outputs.status == 'failure'
        run: exit 1
